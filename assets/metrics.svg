<svg xmlns="http://www.w3.org/2000/svg" width="900" height="215" viewBox="0 0 900 215" role="img" aria-labelledby="mTitle mDesc">
  <title id="mTitle">Project metrics</title>
  <desc id="mDesc">Four animated progress rings: 97.14 percent network intrusion detection accuracy, 87 percent sleep stage validation accuracy, 6 machine learning pipelines shipped, and 100 percent local inference.</desc>

  <defs>
    <linearGradient id="mTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C7B7"/><stop offset="1" stop-color="#41A6F6"/>
    </linearGradient>
    <linearGradient id="mBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41A6F6"/><stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="mPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="mMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff5ec"/><stop offset="1" stop-color="#00C7B7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="215" rx="16" fill="#0d1117"/>

  <!-- 97.14% network intrusion accuracy -->
  <g transform="translate(120,92)">
    <circle r="46" fill="none" stroke="#1f2b3a" stroke-width="9"/>
    <circle r="46" fill="none" stroke="url(#mTeal)" stroke-width="9" stroke-linecap="round"
            transform="rotate(-90)" stroke-dasharray="289" stroke-dashoffset="8.3">
      <animate attributeName="stroke-dashoffset" from="289" to="8.3" dur="1.8s" begin="0.2s" fill="freeze"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#f0f6fc" opacity="1">
      97.14%<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.4s" fill="freeze"/>
    </text>
    <text y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#67e8dc" opacity="1">
      ACCURACY<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.5s" fill="freeze"/>
    </text>
  </g>
  <text x="120" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#c9d1d9">Network Intrusion</text>
  <text x="120" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e">CyberWatch AI</text>

  <!-- 87% sleep stage validation -->
  <g transform="translate(340,92)">
    <circle r="46" fill="none" stroke="#1f2b3a" stroke-width="9"/>
    <circle r="46" fill="none" stroke="url(#mBlue)" stroke-width="9" stroke-linecap="round"
            transform="rotate(-90)" stroke-dasharray="289" stroke-dashoffset="37.6">
      <animate attributeName="stroke-dashoffset" from="289" to="37.6" dur="1.8s" begin="0.4s" fill="freeze"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#f0f6fc" opacity="1">
      87%<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.6s" fill="freeze"/>
    </text>
    <text y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#78bff2" opacity="1">
      VALIDATION<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.7s" fill="freeze"/>
    </text>
  </g>
  <text x="340" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#c9d1d9">Sleep Stage TCN</text>
  <text x="340" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e">Wake · NREM · REM</text>

  <!-- 6 ML pipelines -->
  <g transform="translate(560,92)">
    <circle r="46" fill="none" stroke="#1f2b3a" stroke-width="9"/>
    <circle r="46" fill="none" stroke="url(#mPurple)" stroke-width="9" stroke-linecap="round"
            transform="rotate(-90)" stroke-dasharray="289" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.8s" begin="0.6s" fill="freeze"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#f0f6fc" opacity="1">
      6<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.8s" fill="freeze"/>
    </text>
    <text y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#b48cff" opacity="1">
      PIPELINES<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.9s" fill="freeze"/>
    </text>
  </g>
  <text x="560" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#c9d1d9">ML Models Shipped</text>
  <text x="560" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e">Phishing · Malware · Traffic</text>

  <!-- 100% local -->
  <g transform="translate(780,92)">
    <circle r="46" fill="none" stroke="#1f2b3a" stroke-width="9"/>
    <circle r="46" fill="none" stroke="url(#mMint)" stroke-width="9" stroke-linecap="round"
            transform="rotate(-90)" stroke-dasharray="289" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.8s" begin="0.8s" fill="freeze"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#f0f6fc" opacity="1">
      100%<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2s" fill="freeze"/>
    </text>
    <text y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8ff5ec" opacity="1">
      ON-DEVICE<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.1s" fill="freeze"/>
    </text>
  </g>
  <text x="780" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#c9d1d9">Local Inference</text>
  <text x="780" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e">No data leaves the machine</text>
</svg>
