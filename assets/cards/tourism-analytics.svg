<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">Tourism Experience Analytics project card</title>
  <desc id="desc">Regression, classification and recommendation over 52,930 transactions, with leakage-free target encoding</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C7B7"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1.5" y="1.5" width="492" height="192" rx="16" fill="#0d1117" stroke="url(#border)" stroke-width="3"/>
  <rect x="3" y="3" width="489" height="189" rx="14" fill="url(#glow)"/>

  <circle cx="47" cy="45" r="25" fill="#13242a" stroke="#00C7B7" stroke-width="2"/>
  <g stroke="#00C7B7" stroke-width="2" fill="none">
    <circle cx="47" cy="45" r="14"/>
    <ellipse cx="47" cy="45" rx="6" ry="14"/>
    <line x1="33" y1="45" x2="61" y2="45"/>
    <line x1="36" y1="36" x2="58" y2="36"/>
    <line x1="36" y1="54" x2="58" y2="54"/>
  </g>

  <text x="84" y="42" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Tourism Experience Analytics</text>
  <text x="84" y="63" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Ankit-builds1 / machine learning</text>

  <text x="28" y="98" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="15">Regression, classification and recommendation across</text>
  <text x="28" y="119" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="15">52,930 transactions — every metric against its baseline.</text>

  <rect x="28" y="139" width="118" height="25" rx="12.5" fill="#0f2b2b" stroke="#00C7B7"/>
  <text x="87" y="156" text-anchor="middle" fill="#67e8dc" font-family="Segoe UI,Arial,sans-serif" font-size="12">+22 PTS VS BASE</text>
  <rect x="154" y="139" width="112" height="25" rx="12.5" fill="#1d1630" stroke="#7B2FF7"/>
  <text x="210" y="156" text-anchor="middle" fill="#b48cff" font-family="Segoe UI,Arial,sans-serif" font-size="12">LEAKAGE-FREE</text>
  <rect x="274" y="139" width="82" height="25" rx="12.5" fill="#151f38" stroke="#41A6F6"/>
  <text x="315" y="156" text-anchor="middle" fill="#78bff2" font-family="Segoe UI,Arial,sans-serif" font-size="12">CI VERIFIED</text>

  <text x="467" y="158" text-anchor="end" fill="#b48cff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">OPEN REPOSITORY →</text>

  <circle cx="452" cy="40" r="4" fill="#00C7B7">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="443" y="44" text-anchor="end" fill="#67e8dc" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1">LIVE</text>
</svg>
