<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="img" aria-labelledby="divTitle">
  <title id="divTitle">Section divider</title>
  <defs>
    <linearGradient id="dBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C7B7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#41A6F6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C7B7" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8ff5ec" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="1200" height="2" rx="1" fill="url(#dBase)"/>
  <rect y="2.5" width="260" height="3" rx="1.5" fill="url(#dPulse)">
    <animate attributeName="x" values="-260;1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
