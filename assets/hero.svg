<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ankit Dash — AI/ML and Cybersecurity Engineer</title>
  <desc id="heroDesc">Animated banner with a shifting aurora background, a scanning line, and a rotating set of role descriptions.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C7B7"/>
      <stop offset="0.55" stop-color="#41A6F6"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00C7B7"/>
      <stop offset="0.35" stop-color="#8ff5ec"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#c9a6ff"/>
      <stop offset="1" stop-color="#7B2FF7"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="auroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C7B7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#41A6F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#41A6F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C7B7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ff5ec" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#00C7B7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2735" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

    <!-- drifting aurora -->
    <ellipse cx="210" cy="90" rx="330" ry="210" fill="url(#auroraA)">
      <animate attributeName="cx" values="210;420;180;210" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;170;70;90" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="230" rx="360" ry="220" fill="url(#auroraB)">
      <animate attributeName="cx" values="980;760;1030;980" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;120;250;230" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="300" rx="300" ry="150" fill="url(#auroraC)">
      <animate attributeName="cx" values="620;520;720;620" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- rising particles -->
    <g fill="#00C7B7">
      <circle cx="120" cy="300" r="2">
        <animate attributeName="cy" values="320;-20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="300" r="1.6" >
        <animate attributeName="cy" values="320;-20" dur="12s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="12s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="905" cy="300" r="2.2">
        <animate attributeName="cy" values="320;-20" dur="10.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="10.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#b48cff">
      <circle cx="520" cy="300" r="1.8">
        <animate attributeName="cy" values="320;-20" dur="14s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="14s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="300" r="2">
        <animate attributeName="cy" values="320;-20" dur="11s" begin="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="11s" begin="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="300" r="1.5">
        <animate attributeName="cy" values="320;-20" dur="13s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" begin="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- sweeping scan line -->
    <rect x="-400" y="0" width="400" height="320" fill="url(#scan)" opacity="0.5">
      <animate attributeName="x" values="-400;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets draw in -->
    <g stroke="url(#brand)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M28 74V34h40" stroke-dasharray="80" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="1s" fill="freeze"/>
      </path>
      <path d="M1172 74V34h-40" stroke-dasharray="80" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="1s" begin="0.15s" fill="freeze"/>
      </path>
      <path d="M28 246v40h40" stroke-dasharray="80" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="1s" begin="0.3s" fill="freeze"/>
      </path>
      <path d="M1172 246v40h-40" stroke-dasharray="80" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="1s" begin="0.45s" fill="freeze"/>
      </path>
    </g>

    <!-- name -->
    <text x="600" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"
          font-size="76" font-weight="800" letter-spacing="6" fill="url(#shimmer)" opacity="1">
      ANKIT DASH
      <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.4s" fill="freeze"/>
    </text>

    <!-- underline -->
    <rect x="440" y="164" width="320" height="3" rx="1.5" fill="url(#brand)">
      <animate attributeName="width" from="0" to="320" dur="0.9s" begin="1.1s" fill="freeze"/>
    </rect>

    <!-- rotating role lines: each visible 3s of a 12s loop -->
    <g font-family="Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#c9d1d9">
      <text x="600" y="206" opacity="1">
        AI/ML Engineer Intern @ Labmentix
        <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.04;0.22;0.26;0.5;0.75;0.9;0.95;1" dur="12s" begin="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">
        Building local-first AI security tools
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.22;0.26;0.3;0.47;0.51;0.75;0.95;1" dur="12s" begin="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">
        Machine Learning · Deep Learning · Cybersecurity
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.47;0.51;0.55;0.72;0.76;0.9;0.95;1" dur="12s" begin="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">
        Turning research into working systems
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.8;0.95;0.99;1" dur="12s" begin="1.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- status pill -->
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/>
      <rect x="497" y="234" width="206" height="32" rx="16" fill="#0f2b2b" stroke="#00C7B7" stroke-opacity="0.6"/>
      <circle cx="519" cy="250" r="5" fill="#00C7B7">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;6.5;5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="534" y="255" font-family="Segoe UI,Arial,sans-serif" font-size="13.5"
            letter-spacing="1.4" fill="#67e8dc">OPEN TO OPPORTUNITIES</text>
    </g>

    <rect x="1.5" y="1.5" width="1197" height="317" rx="20" fill="none"
          stroke="url(#brand)" stroke-width="3" opacity="0.85"/>
  </g>
</svg>
